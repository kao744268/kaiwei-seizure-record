<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#172554"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="愷威 Care"
    >


    <!-- ===============================
    CSS
    =============================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- ===============================
    PWA
    =============================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- ===============================
    iPhone / iPad App Icon
    =============================== -->

    <link
        rel="apple-touch-icon"
        href="icon.png"
    >


    <title>愷威 Care</title>

</head>


<body>


<!-- ===============================
主畫面
=============================== -->

<section
    id="homePage"
    class="page active"
>


    <header class="main-header">

        <h1>
            👦 愷威 Care
        </h1>

        <p>
            癲癇紀錄系統
        </p>

    </header>


    <!-- ===============================
    發作紀錄
    =============================== -->

    <section class="seizure-panel">


        <h2>
            🚨 發作紀錄
        </h2>


        <div id="statusBox">

            等待開始紀錄

        </div>


        <div id="timer">

            00:00

        </div>


        <div id="startTimeBox">

            尚未開始

        </div>


        <button
            id="startBtn"
            class="start-button"
        >

            ▶️ 開始發作

        </button>


        <button
            id="stopBtn"
            class="stop-button"
        >

            ⏹ 結束發作

        </button>


        <!-- ===============================
        儲存 / 取消
        =============================== -->

        <div class="record-action-buttons">


            <button
                id="saveBtn"
                class="save-button"
                disabled
            >

                💾 儲存紀錄

            </button>


            <button
                id="cancelBtn"
                class="cancel-button"
                disabled
            >

                ↩️ 取消本次紀錄

            </button>


        </div>


    </section>


    <!-- ===============================
    發作場合
    =============================== -->

    <section class="record-section">


        <h3>
            📍 發作場合
        </h3>


        <div class="option-card">


            <label>

                <input
                    type="radio"
                    name="situation"
                    value="學校"
                >

                🏫 學校

            </label>


            <label>

                <input
                    type="radio"
                    name="situation"
                    value="家中"
                >

                🏠 家中

            </label>


            <label>

                <input
                    type="radio"
                    name="situation"
                    value="睡眠中"
                >

                😴 睡眠中

            </label>


            <label>

                <input
                    type="radio"
                    name="situation"
                    value="外出途中"
                >

                🚗 外出途中

            </label>


            <label>

                <input
                    type="radio"
                    name="situation"
                    value="戶外活動"
                >

                🌳 戶外活動

            </label>


            <label>

                <input
                    type="radio"
                    name="situation"
                    value="其他"
                >

                其他

            </label>


        </div>

    </section>


    <!-- ===============================
    發作型態
    =============================== -->

    <section class="record-section">


        <h3>
            🧠 發作型態
        </h3>


        <div class="option-card">


            <label>

                <input
                    type="checkbox"
                    name="type"
                    value="全身抽搐"
                >

                全身抽搐

            </label>


            <label>

                <input
                    type="checkbox"
                    name="type"
                    value="局部抽搐"
                >

                局部抽搐

            </label>


            <label>

                <input
                    type="checkbox"
                    name="type"
                    value="失神"
                >

                失神

            </label>


            <label>

                <input
                    type="checkbox"
                    name="type"
                    value="僵直"
                >

                僵直

            </label>


            <label>

                <input
                    type="checkbox"
                    name="type"
                    value="其他"
                >

                其他

            </label>


        </div>

    </section>


    <!-- ===============================
    意識狀態
    =============================== -->

    <section class="record-section">


        <h3>
            👀 意識狀態
        </h3>


        <div class="option-card">


            <label>

                <input
                    type="checkbox"
                    name="condition"
                    value="有意識"
                >

                🙂 有意識

            </label>


            <label>

                <input
                    type="checkbox"
                    name="condition"
                    value="意識模糊"
                >

                😵 意識模糊

            </label>


            <label>

                <input
                    type="checkbox"
                    name="condition"
                    value="無意識"
                >

                😴 無意識

            </label>


            <label>

                <input
                    type="checkbox"
                    name="condition"
                    value="呼吸異常"
                >

                ⚠️ 呼吸異常

            </label>


        </div>

    </section>


    <!-- ===============================
    發作後狀態
    =============================== -->

    <section class="record-section">


        <h3>
            🌱 發作後狀態
        </h3>


        <div class="option-card">


            <label>

                <input
                    type="checkbox"
                    name="afterState"
                    value="恢復正常"
                >

                😊 恢復正常

            </label>


            <label>

                <input
                    type="checkbox"
                    name="afterState"
                    value="疲倦想睡"
                >

                😴 疲倦想睡

            </label>


            <label>

                <input
                    type="checkbox"
                    name="afterState"
                    value="意識混亂"
                >

                😵 意識混亂

            </label>


            <label>

                <input
                    type="checkbox"
                    name="afterState"
                    value="情緒不穩"
                >

                😢 情緒不穩

            </label>


            <label>

                <input
                    type="checkbox"
                    name="afterState"
                    value="肌肉無力"
                >

                💤 肌肉無力

            </label>


            <label>

                <input
                    type="checkbox"
                    name="afterState"
                    value="其他"
                >

                其他

            </label>


        </div>

    </section>


    <!-- ===============================
    備註
    =============================== -->

    <section class="record-section">


        <h3>
            📝 備註
        </h3>


        <textarea
            id="note"
            placeholder="記錄發作前後狀況、特殊反應"
        ></textarea>


    </section>


    <!-- ===============================
    快速功能
    =============================== -->

    <section class="quick-menu">


        <button
            id="medicalPageBtn"
            class="small-menu"
        >

            🏥 醫療卡

        </button>


        <button
            id="historyPageBtn"
            class="small-menu"
        >

            📋 歷史紀錄

        </button>


        <button
            id="emergencyPageBtn"
            class="small-menu emergency-small"
        >

            ⚠️ 緊急模式

        </button>


    </section>


</section>


<!-- ===============================
醫療卡
=============================== -->

<section
    id="medicalPage"
    class="page"
>


    <h2>
        🏥 醫療資訊卡
    </h2>


    <div id="medicalCard">
    </div>


    <button class="backBtn">

        返回紀錄

    </button>


</section>


<!-- ===============================
歷史紀錄
=============================== -->

<section
    id="historyPage"
    class="page"
>


    <h2>
        📋 歷史紀錄
    </h2>


    <div id="historyList">
    </div>


    <button class="backBtn">

        返回紀錄

    </button>


</section>


<!-- ===============================
緊急模式
=============================== -->

<section
    id="emergencyPage"
    class="page"
>


    <h2>
        ⚠️ 緊急模式
    </h2>


    <div id="emergencyAlert">

        發作超過5分鐘時將自動提醒

    </div>


    <div class="info-card">


        <h3>
            請依醫囑處理：
        </h3>


        <p>
            ① 給予緊急藥物
        </p>


        <p>
            ② 通知鄰近醫院送醫
        </p>


        <p>
            ③ 聯絡家長
        </p>


    </div>


    <div id="contactList">
    </div>


    <button
        id="emergencyBackBtn"
        class="backBtn"
    >

        返回紀錄

    </button>


</section>


<!-- ===============================
JavaScript
載入順序維持目前穩定版本
=============================== -->

<script src="data.js"></script>

<script src="app.js"></script>

<script src="seizure.js"></script>

<script src="emergency.js"></script>

<script src="medical.js"></script>

<script src="history.js"></script>

<script src="settings.js"></script>


</body>

</html>
