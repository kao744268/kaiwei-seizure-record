<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
愷威 Care｜癲癇守護紀錄系統
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
首頁
========================= -->


<section id="homePage" class="page active">


<header class="hero">


<h1>
👦 愷威 Care
</h1>


<p>
癲癇守護紀錄系統
</p>


<p class="small-text">
今天也一起守護愷威
</p>


</header>





<div class="menu-grid">



<button 
class="menu-card medical"
id="medicalPageBtn">

<div class="icon">
🏥
</div>

<div>

<h3>
孩子醫療資訊
</h3>

<p>
快速查看醫療資訊卡
</p>

</div>

</button>






<button 
class="menu-card seizure"
id="seizurePageBtn">

<div class="icon">
🚨
</div>

<div>

<h3>
發作紀錄
</h3>

<p>
記錄發作時間與狀況
</p>

</div>

</button>






<button 
class="menu-card emergency"
id="emergencyPageBtn">

<div class="icon">
⚠️
</div>

<div>

<h3>
緊急模式
</h3>

<p>
超過5分鐘快速處理資訊
</p>

</div>

</button>






<button 
class="menu-card history"
id="historyPageBtn">

<div class="icon">
📋
</div>

<div>

<h3>
歷史紀錄
</h3>

<p>
查看過往發作資料
</p>

</div>

</button>






<button 
class="menu-card setting"
id="settingsPageBtn">

<div class="icon">
⚙️
</div>

<div>

<h3>
家長設定
</h3>

<p>
資料管理與備份
</p>

</div>

</button>



</div>






<div id="latestBox">

尚無近期紀錄

</div>



</section>









<!-- =========================
發作紀錄頁
========================= -->


<section id="seizurePage" class="page">


<h2>
🚨 發作紀錄
</h2>




<div class="record-tip">

請於發作開始時按下開始，
結束後確認儲存紀錄。

</div>







<div id="timer">

00:00

</div>







<button id="startBtn" class="start-button">

▶️ 開始發作

</button>





<button id="stopBtn" class="stop-button">

⏹ 結束發作

</button>







<div id="statusBox">

等待紀錄

</div>









<!-- 發作場合 -->

<h3>
📍 發作場合
</h3>


<div class="option-card">


<label>

<input
type="radio"
name="situation"
value="學校">

🏫 學校

</label>



<label>

<input
type="radio"
name="situation"
value="家中">

🏠 家中

</label>



<label>

<input
type="radio"
name="situation"
value="外出途中">

🚗 外出途中

</label>



<label>

<input
type="radio"
name="situation"
value="公共場所">

🛒 公共場所

</label>



<label>

<input
type="radio"
name="situation"
value="醫院">

🏥 醫院

</label>



<label>

<input
type="radio"
name="situation"
value="睡眠中">

😴 睡眠中

</label>



<label>

<input
type="radio"
name="situation"
value="戶外活動">

🌳 戶外活動

</label>



<label>

<input
type="radio"
name="situation"
value="其他">

其他

</label>



</div>









<!-- 發作型態 -->


<h3>
🧠 發作型態
</h3>



<div class="option-card">



<label>

<input
type="checkbox"
name="type"
value="全身抽搐">

全身抽搐

</label>



<label>

<input
type="checkbox"
name="type"
value="局部抽搐">

局部抽搐

</label>



<label>

<input
type="checkbox"
name="type"
value="失神">

失神

</label>



<label>

<input
type="checkbox"
name="type"
value="僵直">

僵直

</label>



<label>

<input
type="checkbox"
name="type"
value="其他">

其他

</label>



</div>









<!-- 發作狀況 -->


<h3>
👀 發作狀況
</h3>


<div class="option-card">



<label>

<input
type="checkbox"
name="condition"
value="有意識">

有意識

</label>




<label>

<input
type="checkbox"
name="condition"
value="無意識">

無意識

</label>




<label>

<input
type="checkbox"
name="condition"
value="呼吸異常">

呼吸異常

</label>




<label>

<input
type="checkbox"
name="condition"
value="嘴唇發紫">

嘴唇發紫

</label>



</div>








<h3>
📝 備註
</h3>



<textarea
id="note"
placeholder="記錄發作前後狀況、特殊情形">
</textarea>







<button class="backBtn">

返回首頁

</button>



</section>









<!-- =========================
緊急模式
========================= -->


<section id="emergencyPage" class="page">


<h2>
⚠️ 緊急模式
</h2>



<div id="emergencyAlert">

⚠️ 緊急資訊模式

</div>





<div class="info-card">


<h3>
請依醫囑處理：
</h3>


<p>
① 給予緊急藥物
</p>


<p>
② 通知鄰近醫院送醫
</p>


<p>
③ 通知家長
</p>


</div>






<h3>
📞 緊急聯絡
</h3>


<div id="contactList">

</div>





<button class="backBtn">

返回首頁

</button>



</section>









<!-- =========================
醫療資訊卡
========================= -->


<section id="medicalPage" class="page">


<h2>
🏥 醫療資訊卡
</h2>



<div id="medicalCard">

</div>




<button class="backBtn">

返回首頁

</button>



</section>









<!-- =========================
歷史紀錄
========================= -->


<section id="historyPage" class="page">


<h2>
📋 歷史紀錄
</h2>




<div id="historyList">

</div>




<button class="backBtn">

返回首頁

</button>



</section>









<!-- =========================
設定
========================= -->


<section id="settingsPage" class="page">


<h2>
⚙️ 家長設定
</h2>



<div class="info-card">


<p>
🔒 家長管理模式
</p>


<p>
老師與學校人員：查看模式</p>


<p>
家長：資料管理模式</p>


</div>





<button id="backupBtn">

備份資料

</button>





<button id="exportBtn">

匯出紀錄

</button>





<button class="backBtn">

返回首頁

</button>



</section>









<!-- =========================
JS
========================= -->


<script src="data.js"></script>

<script src="app.js"></script>

<script src="seizure.js"></script>

<script src="emergency.js"></script>

<script src="medical.js"></script>

<script src="history.js"></script>

<script src="settings.js"></script>


</body>

</html>
