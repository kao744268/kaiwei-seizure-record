<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
愷威 Care 癲癇紀錄
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>



<!-- =========================
首頁
========================= -->


<section id="homePage" class="page active">


<h1>
👦 愷威 Care
</h1>


<p class="subtitle">
癲癇發作紀錄照護工具
</p>



<div class="menu">


<button id="seizurePageBtn">

🚨 發作紀錄

</button>



<button id="historyPageBtn">

📋 歷史紀錄

</button>



<button id="medicalPageBtn">

🏥 醫療資料

</button>



<button id="emergencyPageBtn">

📞 緊急資訊

</button>



<button id="settingsPageBtn">

⚙️ 設定

</button>


</div>



<div id="latestBox">

尚無近期紀錄

</div>


</section>









<!-- =========================
發作紀錄
========================= -->


<section id="seizurePage" class="page">


<h2>
🚨 發作紀錄
</h2>



<div id="timer">

00:00

</div>



<button id="startBtn">

開始發作

</button>



<button id="stopBtn">

結束發作

</button>



<div id="statusBox">

尚未開始

</div>







<h3>
發作型態
</h3>


<div class="optionGroup">


<label>
<input type="checkbox" name="type" value="全身抽搐">
全身抽搐
</label>


<label>
<input type="checkbox" name="type" value="局部抽搐">
局部抽搐
</label>


<label>
<input type="checkbox" name="type" value="眼神呆滯">
眼神呆滯
</label>


<label>
<input type="checkbox" name="type" value="失去意識">
失去意識
</label>


<label>
<input type="checkbox" name="type" value="僵直">
僵直
</label>


<label>
<input type="checkbox" name="type" value="顫抖">
顫抖
</label>


<label>
<input type="checkbox" name="type" value="其他">
其他
</label>


</div>







<h3>
發作前狀況
</h3>


<div class="optionGroup">


<label>
<input type="checkbox" name="before" value="睡眠不足">
睡眠不足
</label>


<label>
<input type="checkbox" name="before" value="發燒">
發燒
</label>


<label>
<input type="checkbox" name="before" value="壓力">
壓力
</label>


<label>
<input type="checkbox" name="before" value="忘記服藥">
忘記服藥
</label>


<label>
<input type="checkbox" name="before" value="無明顯原因">
無明顯原因
</label>


</div>







<h3>
發作中觀察
</h3>


<div class="optionGroup">


<label>
<input type="checkbox" name="during" value="哭喊">
哭喊
</label>


<label>
<input type="checkbox" name="during" value="嘴唇發紫">
嘴唇發紫
</label>


<label>
<input type="checkbox" name="during" value="口吐白沫">
口吐白沫
</label>


<label>
<input type="checkbox" name="during" value="眼睛上吊">
眼睛上吊
</label>


<label>
<input type="checkbox" name="during" value="四肢僵硬">
四肢僵硬
</label>


</div>








<h3>
發作後
</h3>


<label>

恢復時間：

<input 
type="number"
id="recoveryTime"
placeholder="分鐘">

分鐘

</label>




<br><br>


<textarea
id="note"
placeholder="其他備註">
</textarea>





<button class="backBtn">

返回首頁

</button>


</section>









<!-- =========================
歷史紀錄
========================= -->


<section id="historyPage" class="page">


<h2>
📋 歷史紀錄
</h2>


<div id="historyList">

</div>


<button class="backBtn">

返回首頁

</button>


</section>









<!-- =========================
醫療資料
========================= -->


<section id="medicalPage" class="page">


<h2>
🏥 醫療資料
</h2>


<div id="medicalContent">

</div>


<button class="backBtn">

返回首頁

</button>


</section>









<!-- =========================
緊急資訊
========================= -->


<section id="emergencyPage" class="page">


<h2>
📞 緊急資訊
</h2>


<div id="emergencyContent">

</div>


<button class="backBtn">

返回首頁

</button>


</section>









<!-- =========================
設定
========================= -->


<section id="settingsPage" class="page">


<h2>
⚙️ 設定
</h2>


<button id="backupBtn">

💾 備份資料

</button>



<button id="exportBtn">

📄 匯出紀錄

</button>



<button id="clearBtn">

🗑️ 清除資料

</button>



<p>
版本：愷威 Care V1.0
</p>



<button class="backBtn">

返回首頁

</button>


</section>









<script src="data.js"></script>

<script src="app.js"></script>

<script src="seizure.js"></script>

<script src="history.js"></script>

</body>


</html>
