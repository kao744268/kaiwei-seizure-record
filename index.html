<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
愷威 Care
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="app">


<!-- ======================
首頁 Dashboard
====================== -->


<section 
id="homePage"
class="page active">


<header class="header">


<h1>
👦 愷威 Care
</h1>


<p>
癲癇紀錄與照護系統
</p>


</header>



<div class="status-card">


<h3>
今日狀態
</h3>


<p id="todayStatus">

🟢 今日尚無紀錄

</p>


</div>





<!-- 主要功能 -->


<div class="main-action">


<button 
id="startSeizureBtn"
class="danger-btn">


🚨 開始發作


</button>


</div>





<div class="menu-grid">



<button id="historyBtn">


📋

<br>

歷史紀錄


</button>



<button id="medicalBtn">


🏥

<br>

醫療資訊卡


</button>




<button id="emergencyBtn">


📞

<br>

緊急聯絡


</button>



<button id="settingsBtn">


⚙️

<br>

設定


</button>



</div>





<div class="latest-card">


<h3>

最近一次發作

</h3>



<div id="latestRecord">

尚無紀錄

</div>



</div>




</section>






<!-- ======================
發作紀錄頁
====================== -->


<section
id="seizurePage"
class="page">


<h2>
🚨 發作紀錄
</h2>



<div class="timer-card">


<div id="timerBox">

00:00:00

</div>



<p id="seizureStatus">

尚未開始

</p>



</div>






<div id="seizureInfo">


<p>

開始時間：

<span id="startTimeText">
--

</span>

</p>



</div>






<button
id="endSeizureBtn"
class="danger-btn">


結束發作


</button>





<button class="backBtn">


返回首頁


</button>



</section>







<!-- ======================
歷史紀錄
====================== -->


<section
id="historyPage"
class="page">


<h2>
📋 歷史紀錄
</h2>



<div
id="recordList">


</div>



<button class="backBtn">

返回首頁

</button>



</section>







<!-- ======================
醫療資訊卡
====================== -->


<section
id="medicalPage"
class="page">


<h2>
🏥 醫療資訊卡
</h2>



<div
id="medicalCard">


</div>




<button class="backBtn">

返回首頁

</button>


</section>







<!-- ======================
緊急聯絡
====================== -->


<section
id="emergencyPage"
class="page">


<h2>
📞 緊急聯絡
</h2>




<div
id="emergencyList">


</div>




<button class="backBtn">

返回首頁

</button>


</section>







<!-- ======================
設定
====================== -->


<section
id="settingsPage"
class="page">


<h2>
⚙️ 設定
</h2>




<div class="settings-list">



<button id="syncBtn">

☁️ Google 同步

</button>




<button id="backupBtn">

💾 備份資料

</button>




<button id="exportBtn">

📄 匯出紀錄

</button>




</div>





<button class="backBtn">

返回首頁

</button>



</section>





</div>







<!-- ======================
Javascript 載入順序
====================== -->


<script src="data.js"></script>

<script src="app.js"></script>

<script src="seizure.js"></script>

<script src="history.js"></script>

<script src="medical.js"></script>

<script src="emergency.js"></script>

<script src="settings.js"></script>

<script src="cloud.js"></script>

</body>

</html>
