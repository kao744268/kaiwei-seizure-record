<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
愷威癲癇紀錄系統 V3.0
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app-container">



<!-- =====================
首頁
===================== -->

<section id="homePage" class="page active">


<h1>
👦 愷威癲癇紀錄系統
</h1>


<p class="version">
V3.0 Clean
</p>



<div class="menu">


<button id="startSeizureBtn">

🚨 開始發作

</button>



<button id="recordBtn">

📋 歷史紀錄

</button>



<button id="medicalBtn">

🏥 醫療資訊卡

</button>



<button id="emergencyBtn">

📞 緊急聯絡

</button>


</div>


</section>






<!-- =====================
發作紀錄頁
===================== -->

<section id="seizurePage" class="page">


<h2>
🚨 發作紀錄
</h2>



<div id="timerBox">

00:00:00

</div>



<button id="endSeizureBtn">

結束發作

</button>



<button class="backBtn">

返回首頁

</button>


</section>







<!-- =====================
歷史紀錄頁
===================== -->

<section id="recordPage" class="page">


<h2>
📋 歷史紀錄
</h2>



<div id="recordList">

尚無紀錄

</div>



<button class="backBtn">

返回首頁

</button>


</section>







<!-- =====================
醫療資訊卡
===================== -->

<section id="medicalPage" class="page">


<h2>
🏥 醫療資訊卡
</h2>



<div id="medicalCard">

尚無資料

</div>



<button class="backBtn">

返回首頁

</button>


</section>







<!-- =====================
緊急聯絡
===================== -->

<section id="emergencyPage" class="page">


<h2>
📞 緊急聯絡
</h2>



<div id="emergencyList">

尚無資料

</div>



<button class="backBtn">

返回首頁

</button>


</section>



</div>





<!-- JS載入順序 -->

<script src="data.js"></script>

<script src="app.js"></script>

<script src="history.js"></script>

<script src="medical.js"></script>

<script src="emergency.js"></script>

<script src="seizure.js"></script>


</body>


</html>
