<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
愷威 Care V1.0
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>

首頁
========================= -->


<section id="homePage" class="page active">


<h1>
👦 愷威 Care
</h1>


<p class="version">

</p>



<div class="menu">

</button>



<button onclick="showPage('recordPage')">

</button>



<button onclick="showPage('medicalPage')">

🏥 醫療資訊

<button onclick="showPage('emergencyPage')">

</button>



<button onclick="showPage('settingPage')">

</button>


</div>



<div id="latestRecord">


尚無近期紀錄


</div>



</section>

發作頁
========================= -->

<h2>
🚨 發作紀錄

<br>


<button class="backBtn"
onclick="showPage('homePage')">

</button>

<!-- =========================
歷史紀錄
========================= -->


<section id="recordPage" class="page">

</h2>



<div id="recordList">

onclick="showPage('homePage')">

</button>



</section>

醫療資訊
========================= -->


<section id="medicalPage" class="page">

</h2>



<div id="medicalCard">


</div>



<button class="backBtn"
onclick="showPage('homePage')">

返回首頁

</button>



</section>









<!-- =========================

========================= -->

</button>

<p>
版本：
Care V1.0 Stable
</p>

Offline
</p>

onclick="showPage('homePage')">

返回首頁

</button>
